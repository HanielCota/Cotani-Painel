version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Só sugere versões publicadas há pelo menos 7 dias.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patches e minors juntos num PR só; majors chegam isolados para revisão.
      dependencias:
        update-types: [minor, patch]
    ignore:
      # Mantido na major do runtime (Node 24, ver "engines").
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
