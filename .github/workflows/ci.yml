name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci
      PLATFORM_ADMIN_CLERK_USER_IDS: user_ci_admin
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cotani
      CRON_SECRET: ci-secret
      NEXT_PUBLIC_APP_URL: https://painel.example.com
      NEXT_PUBLIC_CHECKOUT_URL: https://example.com/checkout
      MERCADO_PAGO_ACCESS_TOKEN: TEST-ci
      MERCADO_PAGO_MONTHLY_PLAN_ID: monthly-ci
      MERCADO_PAGO_ANNUAL_PLAN_ID: annual-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm check
      - run: pnpm build
